app = "lendogo"
primary_region = "jnb"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[env]
  DJANGO_SETTINGS_MODULE = "lendogo.settings"
  PORT = "8080"

[deploy]
  release_command = "python manage.py migrate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
